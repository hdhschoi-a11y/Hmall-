name: Daily Hmall Search Panel Capture

on:
  schedule:
    # UTC 00:30 = KST 09:30 (오늘 테스트용)
    - cron: '30 0 * * *'
  workflow_dispatch: {}   # 수동 실행 버튼 (테스트용)

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설치
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 의존성 설치
        run: npm install

      - name: Playwright 브라우저 설치
        run: npx playwright install --with-deps chromium

      - name: 캡쳐 실행
        run: node capture.js

      - name: 결과 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "검색전 캡쳐"/*.png
          git diff --staged --quiet && echo "변경 사항 없음" || git commit -m "chore: daily capture $(date -u +'%Y-%m-%d')"
          git push
